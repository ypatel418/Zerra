spring.application.name=zerra



spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver



# WHEN COMMITING TO GITHUB, USE THE BELOW PLACEHOLDERS AND SET ENV VARIABLES IN PRODUCTION
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

server.port=${PORT:8080}
server.address=0.0.0.0

spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# FILE UPLOADING CAPACITY
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Encryption config
zerra.encryption.master-key=${ZERRA_MASTER_KEY}
zerra.encryption.pbkdf2-iterations=310000
zerra.encryption.algorithm-version=1
zerra.encryption.enabled=false

# Migration toggle (Phase 3)
zerra.migration.encryption.enabled=false